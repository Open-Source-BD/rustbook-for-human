[book]
title = "Rust for Humans"
description = "A W3Schools-style, learn-by-doing Rust course: dead-simple explanations, runnable examples, quizzes, and a review deck so it actually sticks."
authors = ["Md Shamirul Islam"]
language = "en"
src = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = ""
additional-css = ["theme/retention.css"]
additional-js = ["theme/questions.data.js", "theme/retention.js"]

# Runnable + editable code blocks (the "Try it Yourself" feature). Rust code
# fences get a ▶ Run button that executes on play.rust-lang.org; `,editable`
# turns them into an in-page editor.
[output.html.playground]
editable = true
copyable = true
line-numbers = false

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2

[output.html.fold]
enable = true
level = 1
